<svg width="780" height="280" viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>Story 1: Live Temperatur messen und anzeigen</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="780" height="280" fill="white"/>
<text x="390" y="24" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Story 1: Live Temperatur messen und anzeigen</text>

<!-- Temperatursensor -->
<circle cx="60" cy="100" r="28" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="60" y="105" text-anchor="middle" font-size="20">🌡️</text>
<text x="60" y="140" text-anchor="middle" font-size="10" fill="#4A1B0C">Temperatur-</text>
<text x="60" y="152" text-anchor="middle" font-size="10" fill="#4A1B0C">sensor</text>

<line x1="92" y1="100" x2="148" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="120" y="90" text-anchor="middle" font-size="10" fill="#333">① misst</text>

<rect x="150" y="78" width="90" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="195" y="96" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">Temperatur-</text>
<text x="195" y="111" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">wert</text>

<!-- ESP32 -->
<circle cx="320" cy="100" r="28" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="320" y="105" text-anchor="middle" font-size="20">🔌</text>
<text x="320" y="140" text-anchor="middle" font-size="10" fill="#4A1B0C">ESP32</text>

<line x1="242" y1="100" x2="288" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="265" y="90" text-anchor="middle" font-size="10" fill="#333">② liest</text>

<line x1="350" y1="100" x2="406" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="378" y="90" text-anchor="middle" font-size="10" fill="#333">③ publiziert</text>

<rect x="408" y="78" width="90" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="453" y="96" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">MQTT</text>
<text x="453" y="111" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">Nachricht</text>

<!-- MQTT Broker -->
<circle cx="580" cy="100" r="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="580" y="105" text-anchor="middle" font-size="20">📡</text>
<text x="580" y="140" text-anchor="middle" font-size="10" fill="#04342C">MQTT Broker</text>

<line x1="500" y1="100" x2="548" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="524" y="90" text-anchor="middle" font-size="10" fill="#333">④ leitet weiter</text>

<line x1="580" y1="130" x2="580" y2="178" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="596" y="158" text-anchor="start" font-size="10" fill="#333">⑤ empfängt</text>

<!-- Node-RED -->
<circle cx="580" cy="206" r="28" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="580" y="211" text-anchor="middle" font-size="20">⚙️</text>
<text x="580" y="248" text-anchor="middle" font-size="10" fill="#412402">Node-RED</text>

<line x1="552" y1="206" x2="496" y2="206" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="524" y="196" text-anchor="middle" font-size="10" fill="#333">⑥ zeigt an</text>

<rect x="390" y="184" width="100" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="440" y="202" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">Web</text>
<text x="440" y="217" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">Dashboard</text>

<!-- Nutzer -->
<circle cx="280" cy="206" r="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="280" y="211" text-anchor="middle" font-size="20">👤</text>
<text x="280" y="248" text-anchor="middle" font-size="10" fill="#04342C">Nutzer</text>

<line x1="388" y1="206" x2="312" y2="206" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="196" text-anchor="middle" font-size="10" fill="#333">⑦ liest</text>

<!-- Legend -->
<circle cx="30" cy="268" r="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="44" y="272" font-size="9" fill="#333">Akteur</text>
<rect x="90" y="260" width="20" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="116" y="272" font-size="9" fill="#333">Objekt</text>
<line x1="160" y1="267" x2="185" y2="267" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="192" y="272" font-size="9" fill="#333">Aktivität</text>
</svg>
