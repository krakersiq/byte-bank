<svg width="780" height="300" viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>Story 3: Neuen Sensor integrieren (Erweiterbarkeit)</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="780" height="300" fill="white"/>
<text x="390" y="24" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Story 3: Neuen Sensor integrieren (Erweiterbarkeit)</text>

<!-- CO2 Sensor -->
<circle cx="60" cy="100" r="28" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="60" y="105" text-anchor="middle" font-size="20">💨</text>
<text x="60" y="148" text-anchor="middle" font-size="10" fill="#4A1B0C">CO2 Sensor</text>

<line x1="90" y1="100" x2="146" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="118" y="88" text-anchor="middle" font-size="10" fill="#333">① misst</text>

<rect x="148" y="78" width="90" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="193" y="100" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">CO2 Wert</text>

<!-- ESP32 -->
<circle cx="320" cy="100" r="28" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="320" y="105" text-anchor="middle" font-size="20">🔌</text>
<text x="320" y="148" text-anchor="middle" font-size="10" fill="#4A1B0C">ESP32</text>

<line x1="240" y1="100" x2="288" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="264" y="88" text-anchor="middle" font-size="10" fill="#333">② publiziert</text>

<line x1="350" y1="100" x2="406" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="378" y="88" text-anchor="middle" font-size="10" fill="#333">③ auf Topic</text>

<rect x="408" y="78" width="120" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="468" y="96" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">sensors/room/</text>
<text x="468" y="111" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">co2</text>

<!-- MQTT Broker (routing line) -->
<line x1="528" y1="100" x2="620" y2="100" stroke="#333" stroke-width="1.5"/>
<line x1="620" y1="100" x2="620" y2="185" stroke="#333" stroke-width="1.5"/>
<line x1="620" y1="185" x2="355" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="590" y="88" text-anchor="middle" font-size="10" fill="#333">④ empfängt</text>

<!-- Node-RED -->
<circle cx="320" cy="220" r="28" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="320" y="225" text-anchor="middle" font-size="20">⚙️</text>
<text x="320" y="268" text-anchor="middle" font-size="10" fill="#412402">Node-RED</text>

<line x1="292" y1="220" x2="236" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="264" y="208" text-anchor="middle" font-size="10" fill="#333">⑤ korreliert</text>

<rect x="108" y="198" width="126" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="171" y="216" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">CO2 + Temperatur</text>
<text x="171" y="231" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">im Dashboard</text>

<!-- Legend -->
<circle cx="30" cy="290" r="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="44" y="294" font-size="9" fill="#333">Akteur</text>
<rect x="90" y="282" width="20" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="116" y="294" font-size="9" fill="#333">Objekt</text>
<line x1="160" y1="289" x2="185" y2="289" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="192" y="294" font-size="9" fill="#333">Aktivität</text>
</svg>
