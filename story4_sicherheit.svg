<svg width="780" height="300" viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>Story 4: Sichere Kommunikation außerhalb des Raums</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="780" height="300" fill="white"/>
<text x="390" y="24" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Story 4: Sichere Kommunikation außerhalb des Raums</text>

<!-- Safe zone -->
<rect x="20" y="40" width="360" height="180" rx="12" fill="#F0FFF8" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="200" y="58" text-anchor="middle" font-size="10" fill="#0F6E56" font-weight="bold">🔒 Safe Zone (im Raum)</text>

<!-- ESP32 -->
<circle cx="80" cy="130" r="28" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="80" y="135" text-anchor="middle" font-size="20">🔌</text>
<text x="80" y="178" text-anchor="middle" font-size="10" fill="#4A1B0C">ESP32</text>

<line x1="110" y1="130" x2="166" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="138" y="112" text-anchor="middle" font-size="9" fill="#333">① publiziert</text>
<text x="138" y="124" text-anchor="middle" font-size="9" fill="#D85A30">(unverschlüsselt)</text>

<rect x="168" y="108" width="90" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="213" y="126" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">MQTT</text>
<text x="213" y="141" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">Nachricht</text>

<!-- MQTT Broker -->
<circle cx="320" cy="130" r="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="320" y="135" text-anchor="middle" font-size="20">📡</text>
<text x="320" y="178" text-anchor="middle" font-size="10" fill="#04342C">MQTT Broker</text>

<line x1="260" y1="130" x2="288" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="274" y="118" text-anchor="middle" font-size="9" fill="#333">② weiter</text>

<line x1="350" y1="130" x2="440" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="395" y="112" text-anchor="middle" font-size="9" fill="#333">③ verschlüsselt</text>
<text x="395" y="124" text-anchor="middle" font-size="9" fill="#0F6E56">via TLS Port 8883</text>

<rect x="442" y="108" width="110" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="497" y="126" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">verschlüsselte</text>
<text x="497" y="141" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">Nachricht 🔐</text>

<!-- Externer Nutzer -->
<circle cx="660" cy="130" r="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="660" y="135" text-anchor="middle" font-size="20">👤</text>
<text x="660" y="178" text-anchor="middle" font-size="10" fill="#04342C">Externer Nutzer</text>

<line x1="554" y1="130" x2="628" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="591" y="118" text-anchor="middle" font-size="9" fill="#333">④ empfängt</text>

<line x1="660" y1="158" x2="660" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="676" y="188" text-anchor="start" font-size="9" fill="#333">⑤ liest via HTTPS</text>

<rect x="600" y="212" width="110" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="655" y="230" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">Web</text>
<text x="655" y="245" text-anchor="middle" font-size="10" fill="#26215C" font-weight="bold">Dashboard 🔐</text>

<!-- Legend -->
<circle cx="30" cy="278" r="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="44" y="282" font-size="9" fill="#333">Akteur</text>
<rect x="90" y="270" width="20" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="116" y="282" font-size="9" fill="#333">Objekt</text>
<line x1="160" y1="277" x2="185" y2="277" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="192" y="282" font-size="9" fill="#333">Aktivität</text>
<rect x="250" y="270" width="30" height="14" rx="3" fill="#F0FFF8" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 2"/>
<text x="286" y="282" font-size="9" fill="#0F6E56">Safe Zone</text>
</svg>
